[toolchain]
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
launch_program = "Launch1111111111111111111111111111111111111"
market_program = "Market1111111111111111111111111111111111111"
vault_program = "Vault11111111111111111111111111111111111111"
reflex_program = "Reflex1111111111111111111111111111111111111"
config_program = "Config1111111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.test.ts"

